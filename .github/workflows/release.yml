name: Release

# Baut die Mac-App und legt sie als Release auf GitHub ab.
# Dazu kommen unsignierte IPA-Dateien für iPhone/iPad und Apple TV. Die signiert ein Sideload-Werkzeug
# (Sideloadly, AltStore) mit der eigenen, auch kostenlosen Apple-ID.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versionsnummer, zum Beispiel 0.1.0
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  mac:
    name: Mac-App bauen und veröffentlichen
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project Frames.xcodeproj \
            -scheme Frames \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ inputs.version }}" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= 2>&1 | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release/Frames.app
      - name: App prüfen (Frameworks und Icon im Paket)
        run: scripts/pruefe-mac-app.sh build/Build/Products/Release/Frames.app --signatur
      - name: DMG packen
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/Frames.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Frames -srcfolder dmg -ov -format UDZO "Frames-${{ inputs.version }}.dmg"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notizen.md <<'TEXT'
          Frames für den Mac.

          Die App ist nicht von Apple beglaubigt. Beim ersten Start meldet macOS deshalb, dass sie nicht geöffnet werden kann. Dann unter Systemeinstellungen, Datenschutz & Sicherheit auf „Dennoch öffnen“ klicken. Das ist nur einmal nötig.

          iPhone und iPad: `Frames-iOS-…-unsigniert.ipa` mit Sideloadly oder AltStore und der eigenen Apple-ID aufs Gerät spielen, das geht auch unter Windows. Mit einer kostenlosen Apple-ID läuft die App 7 Tage, dann einfach neu aufspielen.

          Apple TV: `Frames-tvOS-…-unsigniert.ipa` lässt sich mit Sideloadly aufspielen, wenn das Apple TV mit dem Rechner gekoppelt ist. Alternativ aus Xcode, siehe README.
          TEXT
          gh release create "v${{ inputs.version }}" "Frames-${{ inputs.version }}.dmg" \
            --target "${{ github.sha }}" \
            --title "Frames ${{ inputs.version }}" \
            --notes-file notizen.md

  geraete:
    name: IPA bauen (${{ matrix.name }})
    needs: mac
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            products: Release-iphoneos
          - name: tvOS
            destination: generic/platform=tvOS
            products: Release-appletvos
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: App bauen, unsigniert
        run: |
          set -o pipefail
          xcodebuild build \
            -project Frames.xcodeproj \
            -scheme Frames \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ inputs.version }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d "build/Build/Products/${{ matrix.products }}/Frames.app"
      - name: IPA packen und anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir Payload
          cp -R "build/Build/Products/${{ matrix.products }}/Frames.app" Payload/
          NAME="Frames-${{ matrix.name }}-${{ inputs.version }}-unsigniert.ipa"
          zip -qry "$NAME" Payload
          ls -la "$NAME"
          gh release upload "v${{ inputs.version }}" "$NAME" --clobber
