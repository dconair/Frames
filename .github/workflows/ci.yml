name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: FramesCore testen
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  apps:
    name: App bauen (${{ matrix.name }})
    # Die Player-Engine verlangt Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          # Für den Fernseher wird das Gerät gebaut, nicht der Simulator: die Dolby-Vision-Bibliothek
          # der Player-Engine bringt für den tvOS-Simulator nur arm64 mit, der allgemeine
          # Simulator-Build verlangt aber auch x86_64.
          - name: tvOS
            destination: generic/platform=tvOS
          - name: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project Frames.xcodeproj
          -scheme Frames
          -destination "${{ matrix.destination }}"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
