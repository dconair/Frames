name: TestFlight

# Baut Frames für iPhone/iPad und Apple TV, signiert mit dem Apple-Developer-Konto und lädt den Build zu TestFlight hoch.
# Läuft von Hand (Actions › TestFlight › Run workflow) oder wenn ein Tag wie v0.2.0 gepusht wird.
# Einrichtung der Secrets: docs/testflight.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versionsnummer, zum Beispiel 0.2.0 (leer = aus project.yml)
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: ${{ matrix.name }} zu TestFlight
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone und iPad
            platform: iOS
            scheme_dest: generic/platform=iOS
          - name: Apple TV
            platform: tvOS
            scheme_dest: generic/platform=tvOS
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Secrets prüfen
        run: |
          missing=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret fehlt: $n (siehe docs/testflight.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - run: brew install xcodegen

      - name: Version bestimmen
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$v" ]; then v=$(grep -m1 MARKETING_VERSION project.yml | sed -E 's/.*: *"?([0-9.]+)"?.*/\1/'); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v, Build ${{ github.run_number }}"

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - run: xcodegen generate

      - name: Archiv bauen
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Frames.xcodeproj \
            -scheme Frames \
            -configuration Release \
            -destination "${{ matrix.scheme_dest }}" \
            -archivePath "build/Frames-${{ matrix.platform }}.xcarchive" \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | grep -E "error:|warning: unable|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "build/Frames-${{ matrix.platform }}.xcarchive"

      - name: Exportieren und zu TestFlight hochladen
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "build/Frames-${{ matrix.platform }}.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API-Schlüssel löschen
        if: always()
        run: rm -rf "$HOME/private_keys"
